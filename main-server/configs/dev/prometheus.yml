global:
  scrape_interval: 15s
  evaluation_interval: 15s

# agent WAL replay backfill 허용 (out-of-order 400 방지). CLI 플래그 아님 — config 파일 항목.
storage:
  tsdb:
    out_of_order_time_window: 1h

rule_files:
  - "/etc/prometheus/alert_rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # 로컬에서 직접 실행 중인 admin-api 스크레이핑 (host.docker.internal = Mac 호스트)
  - job_name: "admin-api"
    static_configs:
      - targets: ["host.docker.internal:8080"]
    metrics_path: /metrics
