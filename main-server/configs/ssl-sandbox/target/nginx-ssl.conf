# 443 TLS 서버 — 배포된 인증서 경로(cert_dir=/etc/nginx/ssl)를 참조.
# 최초엔 entrypoint가 self-signed를 깔아 두므로 nginx가 즉시 443 리슨 가능.
# 배포 후 ssl_deployer가 fullchain.cer/cert.key를 덮어쓰고 reload 한다.
server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/fullchain.cer;
    ssl_certificate_key /etc/nginx/ssl/cert.key;

    location / {
        default_type text/plain;
        return 200 "synapse ssl-target ok\n";
    }
}
