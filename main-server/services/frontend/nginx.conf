server {
    listen 80;
    server_name _;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' ws: wss:; font-src 'self' data:; frame-src 'self';" always;

    root /usr/share/nginx/html;
    index index.html;

    # admin-api 프록시
    location /api/ {
        proxy_pass http://admin-api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_http_version 1.1;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # SSE 챗봇 메시지 엔드포인트 — 버퍼링 비활성화 + 긴 타임아웃
    location ~ ^/api/v1/(chat|help)/sessions/.+/messages {
        proxy_pass http://admin-api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        chunked_transfer_encoding on;
    }
    
    # oauth 인증                                                                                                                                                                                                  
    location ~ ^/(\.well-known/openid-configuration|oauth/(authorize|token|userinfo|jwks))$ {                                       
        proxy_pass http://admin-api:8080;                                                                                              
        proxy_set_header Host $host;                                                                                                
        proxy_set_header X-Real-IP $remote_addr;                                                                                    
    }

    # log-analyzer 프록시
    location /analyze/ {
        proxy_pass http://log-analyzer:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /aggregation/ {
        proxy_pass http://log-analyzer:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Grafana 프록시 (iframe 임베딩 — sub-path 그대로 전달)
    location /grafana/ {
        proxy_pass https://grafana:3000;
        proxy_ssl_verify off;
        proxy_ssl_server_name on;
        proxy_ssl_name grafana;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # 이 블록에 add_header가 있으면 부모 server 블록의 add_header(CSP 포함)가 무효화됨.
        # GF_SECURITY_CONTENT_SECURITY_POLICY=false 이므로 CSP 없이 운용 (폐쇄망 내부 뷰어 전용).
        # X-Frame-Options는 Grafana(GF_SECURITY_ALLOW_EMBEDDING=true)가 관리.
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
