# 로컬 개발용 docker-compose
# 인프라 서비스만 실행 — admin-api, log-analyzer는 직접 uvicorn으로 실행
#
# 사용법:
#   docker compose -f docker-compose.dev.yml up -d
#   또는 프로젝트 루트에서: make dev-up

services:
  postgres:
    image: postgres:16.13-alpine
    container_name: dev-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=synapse
      - POSTGRES_USER=synapse
      - POSTGRES_PASSWORD=synapse
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      - ./configs/postgres/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synapse -d synapse"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - dev-net

  prometheus:
    image: prom/prometheus:v3.11.3
    container_name: dev-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./configs/dev/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./configs/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus_dev_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=3d'
      - '--web.enable-lifecycle'
      - '--web.enable-remote-write-receiver'
    extra_hosts:
      - "host.docker.internal:host-gateway"   # Mac에서 호스트 접근
    restart: unless-stopped
    networks:
      - dev-net

  alertmanager:
    image: prom/alertmanager:v0.32.1
    container_name: dev-alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./configs/dev/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"   # Mac에서 호스트 접근
    restart: unless-stopped
    networks:
      - dev-net

  qdrant:
    image: qdrant/qdrant:v1.17.0
    container_name: dev-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_dev_data:/qdrant/storage
    restart: unless-stopped
    networks:
      - dev-net

  grafana:
    image: grafana/grafana:12.4.2
    container_name: dev-grafana
    ports:
      - "3000:3000"
    volumes:
      - ./configs/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./configs/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_dev_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_SERVER_PROTOCOL=http
      - GF_SERVER_ROOT_URL=http://localhost:3001/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      - GF_DATE_FORMATS_DEFAULT_TIMEZONE=Asia/Seoul
      # Prometheus datasource (dev: 인증 없음)
      - PROM_URL=http://prometheus:9090
      - PROM_USER=
      - PROM_PASS=
    depends_on: [prometheus]
    restart: unless-stopped
    networks:
      - dev-net

  # frontend는 Docker 이미지 없이 `make run-frontend` (npm run dev)로 실행
  # docker compose에서 제외 — 빌드된 이미지(synapse-frontend:1.0) 없어도 dev-up 가능

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: dev-clickhouse
    ports:
      - "8123:8123"
    environment:
      # CLICKHOUSE_PASSWORD 이름은 이미지 entrypoint 가 default 사용자 설정으로 해석하므로 사용 금지
      - AGENT_T_CH_PASSWORD=${CLICKHOUSE_PASSWORD:-agent_t_dev}
    volumes:
      - clickhouse_dev_data:/var/lib/clickhouse
      - ./configs/clickhouse/init:/docker-entrypoint-initdb.d:ro
      - ./configs/clickhouse/users.d:/etc/clickhouse-server/users.d:ro
      # config.d 디렉터리 통째 마운트 시 이미지의 docker_related_config.xml(listen 0.0.0.0)이 가려져 외부 접속 불가 — 파일 단위 마운트
      - ./configs/clickhouse/config.d/limits.xml:/etc/clickhouse-server/config.d/limits.xml:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8123/ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - dev-net

  agent-t-gateway:
    build: ../agent-t-gateway
    container_name: dev-agent-t-gateway
    ports:
      - "8330:8330"
    environment:
      - GATEWAY_LISTEN=:8330
      - GATEWAY_PG_DSN=postgres://synapse@postgres:5432/synapse?sslmode=disable
      - PGPASSWORD=synapse
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key}
      - CLICKHOUSE_URL=http://clickhouse:8123
      - CLICKHOUSE_DB=agent_t
      - CLICKHOUSE_USER=agent_t
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:-agent_t_dev}
      - PROMETHEUS_REMOTE_WRITE_URL=http://prometheus:9090/api/v1/write
      - GATEWAY_FLUSH_INTERVAL=1s
      - GATEWAY_FLUSH_ROWS=10000
      - GATEWAY_CH_QUEUE_MAX_BYTES=134217728
      - GOMEMLIMIT=400MiB
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - dev-net

  # Ollama 제거 (ADR-011) — 임베딩은 log-analyzer 컨테이너 내 FastEmbed ONNX로 이전됨
  # 로컬 개발에서도 `make run-analyzer` 시 fastembed 패키지가 직접 모델을 로드함

volumes:
  postgres_dev_data:
  prometheus_dev_data:
  qdrant_dev_data:
  grafana_dev_data:
  clickhouse_dev_data:

networks:
  dev-net:
    driver: bridge
